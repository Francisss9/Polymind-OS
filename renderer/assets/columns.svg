<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" fill="none" aria-hidden="true">
  <defs>
    <pattern id="stipple" width="3" height="3" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="0.55" fill="white" opacity="0.85"/>
    </pattern>
    <pattern id="stipple-fine" width="2.5" height="2.5" patternUnits="userSpaceOnUse">
      <circle cx="1.25" cy="1.25" r="0.45" fill="white" opacity="0.7"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <!-- Column 1  tall, left -->
  <g transform="translate(48, 40)">
    <rect x="0" y="0" width="72" height="520" fill="url(#stipple)"/>
    <rect x="8" y="0" width="56" height="48" fill="url(#stipple-fine)"/>
    <rect x="0" y="48" width="72" height="12" fill="url(#stipple)"/>
    <rect x="12" y="60" width="48" height="460" fill="url(#stipple-fine)"/>
  </g>

  <!-- Column 2  medium, center -->
  <g transform="translate(164, 120)">
    <rect x="0" y="0" width="64" height="440" fill="url(#stipple)"/>
    <rect x="6" y="0" width="52" height="44" fill="url(#stipple-fine)"/>
    <rect x="0" y="44" width="64" height="10" fill="url(#stipple)"/>
    <rect x="10" y="54" width="44" height="386" fill="url(#stipple-fine)"/>
  </g>

  <!-- Column 3  short, right -->
  <g transform="translate(272, 200)">
    <rect x="0" y="0" width="56" height="360" fill="url(#stipple)"/>
    <rect x="5" y="0" width="46" height="40" fill="url(#stipple-fine)"/>
    <rect x="0" y="40" width="56" height="9" fill="url(#stipple)"/>
    <rect x="9" y="49" width="38" height="311" fill="url(#stipple-fine)"/>
  </g>

  <rect width="400" height="600" fill="url(#fade)"/>
</svg>
